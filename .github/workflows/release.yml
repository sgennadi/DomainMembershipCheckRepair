name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  actions: read
  contents: write
  id-token: write
  attestations: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'
  SIGNPATH_ORGANIZATION_ID: ${{ vars.SIGNPATH_ORGANIZATION_ID }}

jobs:
  release:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@30375c66a4eea26614e0d39710365f22f8b0af57 # v3

      - name: Build native repository tools
        shell: cmd
        run: msbuild Tools\DomainMembershipCheckRepair.Tools.csproj /m /t:Rebuild /p:Configuration=Release /p:Platform=AnyCPU

      - name: Validate repository policies
        shell: cmd
        run: Tools\bin\Release\DomainMembershipCheckRepair.Tools.exe validate-repository --root .

      - name: Validate release tag
        shell: cmd
        run: Tools\bin\Release\DomainMembershipCheckRepair.Tools.exe release-validate-tag --root .

      - name: Verify .NET Framework targeting packs
        shell: cmd
        run: |
          if not exist "%ProgramFiles(x86)%\Reference Assemblies\Microsoft\Framework\.NETFramework\v4.8\mscorlib.dll" exit /b 1
          if not exist "%ProgramFiles(x86)%\Reference Assemblies\Microsoft\Framework\.NETFramework\v4.8.1\mscorlib.dll" exit /b 1

      - name: Build unit tests
        shell: cmd
        run: msbuild Tests\DomainMembershipCheckRepair.Tests.csproj /m /t:Rebuild /p:Configuration=Release /p:Platform=AnyCPU

      - name: Run unit tests
        shell: cmd
        run: Tests\bin\Release\DomainMembershipCheckRepair.Tests.exe

      - name: Build x86
        shell: cmd
        run: msbuild DomainMembershipCheckRepair.csproj /m /t:Rebuild /p:Configuration=Release /p:Platform=x86

      - name: Build x64
        shell: cmd
        run: msbuild DomainMembershipCheckRepair.csproj /m /t:Rebuild /p:Configuration=Release /p:Platform=x64

      - name: Build ARM64
        shell: cmd
        run: msbuild DomainMembershipCheckRepair.csproj /m /t:Rebuild /p:Configuration=Release /p:Platform=ARM64

      - name: Prepare unsigned release files
        id: prepare
        shell: cmd
        run: Tools\bin\Release\DomainMembershipCheckRepair.Tools.exe release-prepare --root . --unsigned unsigned --configs release-configs --github-output "%GITHUB_OUTPUT%"

      - name: Upload unsigned artifact for SignPath origin verification
        id: upload-unsigned
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: DomainMembershipCheckRepair-unsigned-${{ github.ref_name }}
          path: unsigned/*.exe
          if-no-files-found: error
          retention-days: 14

      - name: Validate mandatory SignPath configuration
        shell: cmd
        env:
          SIGNPATH_API_TOKEN: ${{ secrets.SIGNPATH_API_TOKEN }}
        run: Tools\bin\Release\DomainMembershipCheckRepair.Tools.exe release-validate-signpath

      - name: Submit mandatory SignPath signing request
        uses: signpath/github-action-submit-signing-request@f6d04783b4569d051e0c80105fe66e82819d0092 # v3, Node.js 24
        with:
          api-token: '${{ secrets.SIGNPATH_API_TOKEN }}'
          organization-id: '${{ env.SIGNPATH_ORGANIZATION_ID }}'
          project-slug: 'DomainMembershipCheckRepair'
          signing-policy-slug: 'release-signing'
          github-artifact-id: '${{ steps.upload-unsigned.outputs.artifact-id }}'
          wait-for-completion: true
          wait-for-completion-timeout-in-seconds: '3600'
          output-artifact-directory: 'signed'
          parameters: |
            version: ${{ toJSON(steps.prepare.outputs.product_version) }}

      - name: Validate SignPath-signed executables
        shell: cmd
        env:
          EXPECTED_VERSION: ${{ steps.prepare.outputs.product_version }}
          SIGNPATH_EXPECTED_SIGNER_SUBJECT: ${{ vars.SIGNPATH_EXPECTED_SIGNER_SUBJECT }}
        run: Tools\bin\Release\DomainMembershipCheckRepair.Tools.exe release-validate-signed --signed signed --expected-version "%EXPECTED_VERSION%"

      - name: Finalize release files and checksums
        shell: cmd
        run: Tools\bin\Release\DomainMembershipCheckRepair.Tools.exe release-finalize --signed signed --configs release-configs --output release-files

      - name: Smoke-test signed release files
        shell: cmd
        run: Tools\bin\Release\DomainMembershipCheckRepair.Tools.exe release-smoke --directory release-files

      - name: Attest final release files
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-checksums: release-files/SHA256SUMS.txt

      - name: Publish GitHub Release
        shell: cmd
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "%GITHUB_REF_NAME%" release-files\DomainMembershipCheckRepair-x86.exe release-files\DomainMembershipCheckRepair-x86.exe.config release-files\DomainMembershipCheckRepair-x64.exe release-files\DomainMembershipCheckRepair-x64.exe.config release-files\DomainMembershipCheckRepair-arm64.exe release-files\DomainMembershipCheckRepair-arm64.exe.config release-files\SHA256SUMS.txt --notes-file release-files\RELEASE_NOTES.md --title "%GITHUB_REF_NAME%"
