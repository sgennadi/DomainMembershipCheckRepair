name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  actions: read
  contents: write
  id-token: write
  attestations: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'
  SIGNPATH_ORGANIZATION_ID: ${{ vars.SIGNPATH_ORGANIZATION_ID }}

jobs:
  release:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@30375c66a4eea26614e0d39710365f22f8b0af57 # v3

      - name: Validate release tag
        shell: pwsh
        run: |
          $source = Get-Content .\VersionInfo.cs -Raw
          $match = [regex]::Match($source, 'ProductVersion\s*=\s*"([^"]+)"')
          if (-not $match.Success) { throw "Could not read ProductVersion from VersionInfo.cs" }
          $expected = "v$($match.Groups[1].Value)"
          if ($env:GITHUB_REF_NAME -ne $expected) {
            throw "Tag $env:GITHUB_REF_NAME does not match VersionInfo.cs ($expected)"
          }

      - name: Verify .NET Framework targeting packs
        shell: pwsh
        run: |
          $base = "${env:ProgramFiles(x86)}\Reference Assemblies\Microsoft\Framework\.NETFramework"
          if (-not (Test-Path "$base\v4.8\mscorlib.dll")) { throw ".NET Framework 4.8 targeting pack is missing" }
          if (-not (Test-Path "$base\v4.8.1\mscorlib.dll")) { throw ".NET Framework 4.8.1 targeting pack is missing (required for ARM64)" }

      - name: Build unit tests
        shell: cmd
        run: msbuild Tests\DomainMembershipCheckRepair.Tests.csproj /m /t:Rebuild /p:Configuration=Release /p:Platform=AnyCPU

      - name: Run unit tests
        shell: pwsh
        run: |
          & .\Tests\bin\Release\DomainMembershipCheckRepair.Tests.exe
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Build x86
        shell: cmd
        run: msbuild DomainMembershipCheckRepair.csproj /m /t:Rebuild /p:Configuration=Release /p:Platform=x86

      - name: Build x64
        shell: cmd
        run: msbuild DomainMembershipCheckRepair.csproj /m /t:Rebuild /p:Configuration=Release /p:Platform=x64

      - name: Build ARM64
        shell: cmd
        run: msbuild DomainMembershipCheckRepair.csproj /m /t:Rebuild /p:Configuration=Release /p:Platform=ARM64

      - name: Prepare unsigned release files
        id: prepare
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force unsigned | Out-Null
          New-Item -ItemType Directory -Force release-configs | Out-Null
          $configs = @(
            ".\bin\Release\x86\DomainMembershipCheckRepair.exe.config",
            ".\bin\Release\x64\DomainMembershipCheckRepair.exe.config",
            ".\bin\Release\ARM64\DomainMembershipCheckRepair.exe.config"
          )
          foreach ($config in $configs) {
            if (-not (Test-Path $config)) { throw "Required DPI config is missing: $config" }
            $configText = Get-Content $config -Raw
            if ($configText -notmatch 'PerMonitorV2') { throw "PerMonitorV2 is missing from: $config" }
          }

          Copy-Item .\bin\Release\x86\DomainMembershipCheckRepair.exe .\unsigned\DomainMembershipCheckRepair-x86.exe
          Copy-Item .\bin\Release\x64\DomainMembershipCheckRepair.exe .\unsigned\DomainMembershipCheckRepair-x64.exe
          Copy-Item .\bin\Release\ARM64\DomainMembershipCheckRepair.exe .\unsigned\DomainMembershipCheckRepair-arm64.exe
          Copy-Item .\bin\Release\x86\DomainMembershipCheckRepair.exe.config .\release-configs\DomainMembershipCheckRepair-x86.exe.config
          Copy-Item .\bin\Release\x64\DomainMembershipCheckRepair.exe.config .\release-configs\DomainMembershipCheckRepair-x64.exe.config
          Copy-Item .\bin\Release\ARM64\DomainMembershipCheckRepair.exe.config .\release-configs\DomainMembershipCheckRepair-arm64.exe.config

          $version = (Get-Item .\bin\Release\x64\DomainMembershipCheckRepair.exe).VersionInfo.ProductVersion
          if ([string]::IsNullOrWhiteSpace($version)) {
            throw "Unable to read ProductVersion from the built executable."
          }

          $source = Get-Content .\VersionInfo.cs -Raw
          $match = [regex]::Match($source, 'ProductVersion\s*=\s*"([^"]+)"')
          if (-not $match.Success) { throw "Could not read ProductVersion from VersionInfo.cs" }
          if ($version -ne $match.Groups[1].Value) {
            throw "Built ProductVersion '$version' does not match VersionInfo.cs '$($match.Groups[1].Value)'"
          }

          Write-Host "ProductVersion: $version"
          "product_version=$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append

      - name: Upload unsigned artifact for SignPath origin verification
        id: upload-unsigned
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: DomainMembershipCheckRepair-unsigned-${{ github.ref_name }}
          path: unsigned/*.exe
          if-no-files-found: error
          retention-days: 14

      - name: Validate mandatory SignPath configuration
        shell: pwsh
        env:
          SIGNPATH_API_TOKEN: ${{ secrets.SIGNPATH_API_TOKEN }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:SIGNPATH_ORGANIZATION_ID)) {
            throw "SIGNPATH_ORGANIZATION_ID repository variable is required. Future releases are signing-required and will not publish unsigned binaries."
          }
          if ([string]::IsNullOrWhiteSpace($env:SIGNPATH_API_TOKEN)) {
            throw "SIGNPATH_API_TOKEN repository secret is required. Future releases are signing-required and will not publish unsigned binaries."
          }

      - name: Submit mandatory SignPath signing request
        uses: signpath/github-action-submit-signing-request@f6d04783b4569d051e0c80105fe66e82819d0092 # v3, Node.js 24
        with:
          api-token: '${{ secrets.SIGNPATH_API_TOKEN }}'
          organization-id: '${{ env.SIGNPATH_ORGANIZATION_ID }}'
          project-slug: 'DomainMembershipCheckRepair'
          signing-policy-slug: 'release-signing'
          github-artifact-id: '${{ steps.upload-unsigned.outputs.artifact-id }}'
          wait-for-completion: true
          wait-for-completion-timeout-in-seconds: '3600'
          output-artifact-directory: 'signed'
          parameters: |
            version: ${{ toJSON(steps.prepare.outputs.product_version) }}

      - name: Validate SignPath-signed executables
        shell: pwsh
        run: |
          $names = @(
            "DomainMembershipCheckRepair-x86.exe",
            "DomainMembershipCheckRepair-x64.exe",
            "DomainMembershipCheckRepair-arm64.exe"
          )

          foreach ($name in $names) {
            $file = Get-ChildItem -Path .\signed -Recurse -File -Filter $name | Select-Object -First 1
            if (-not $file) {
              throw "Signed artifact is missing $name"
            }

            $sig = Get-AuthenticodeSignature -FilePath $file.FullName
            Write-Host "$name : $($sig.Status) : $($sig.SignerCertificate.Subject)"
            if ($sig.Status -ne "Valid") {
              throw "Authenticode validation failed for $name. Status: $($sig.Status)"
            }
          }

      - name: Finalize release files and checksums
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force release-files | Out-Null
          $names = @(
            "DomainMembershipCheckRepair-x86.exe",
            "DomainMembershipCheckRepair-x64.exe",
            "DomainMembershipCheckRepair-arm64.exe"
          )

          foreach ($name in $names) {
            $file = Get-ChildItem -Path .\signed -Recurse -File -Filter $name | Select-Object -First 1
            if (-not $file) { throw "Signed file not found: $name" }
            Copy-Item $file.FullName (Join-Path .\release-files $name)
          }

          Copy-Item .\release-configs\DomainMembershipCheckRepair-x86.exe.config .\release-files\DomainMembershipCheckRepair-x86.exe.config
          Copy-Item .\release-configs\DomainMembershipCheckRepair-x64.exe.config .\release-files\DomainMembershipCheckRepair-x64.exe.config
          Copy-Item .\release-configs\DomainMembershipCheckRepair-arm64.exe.config .\release-files\DomainMembershipCheckRepair-arm64.exe.config

          $signingStatus = "These release executables are Authenticode-signed using SignPath.io with a certificate provided by SignPath Foundation. The workflow refuses to publish unsigned release binaries."

          $lines = Get-ChildItem .\release-files\DomainMembershipCheckRepair-* -File | Sort-Object Name | ForEach-Object {
            $hash = (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
            "$hash  $($_.Name)"
          }
          $lines | Set-Content -Encoding ascii .\release-files\SHA256SUMS.txt

          @"
          ## Code signing policy

          Free code signing provided by [SignPath.io](https://signpath.io/), certificate by [SignPath Foundation](https://signpath.org/).

          $signingStatus

          See the repository [Code signing policy](https://github.com/sgennadi/DomainMembershipCheckRepair/blob/main/SIGNING.md) for build, approval, privacy, and verification details.

          ## Supply-chain verification

          SHA-256 checksums are attached to this release. GitHub build-provenance attestations are generated for the final release files.

          Keep the matching .exe.config file next to the executable. It contains the required WinForms PerMonitorV2/high-DPI configuration.

          ## Source

          Tag: $env:GITHUB_REF_NAME

          Full changelog: https://github.com/sgennadi/DomainMembershipCheckRepair/commits/$env:GITHUB_REF_NAME
          "@ | Set-Content -Encoding utf8 .\release-files\RELEASE_NOTES.md

      - name: Attest final release files
        uses: actions/attest-build-provenance@977bb373ede98d70efdf65b84cb5f73e068dcc2a # v3
        with:
          subject-checksums: release-files/SHA256SUMS.txt

      - name: Publish GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$env:GITHUB_REF_NAME" `
            .\release-files\DomainMembershipCheckRepair-x86.exe `
            .\release-files\DomainMembershipCheckRepair-x86.exe.config `
            .\release-files\DomainMembershipCheckRepair-x64.exe `
            .\release-files\DomainMembershipCheckRepair-x64.exe.config `
            .\release-files\DomainMembershipCheckRepair-arm64.exe `
            .\release-files\DomainMembershipCheckRepair-arm64.exe.config `
            .\release-files\SHA256SUMS.txt `
            --notes-file .\release-files\RELEASE_NOTES.md `
            --title "$env:GITHUB_REF_NAME"
