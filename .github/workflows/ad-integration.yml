name: AD Integration Lab

on:
  workflow_dispatch:
    inputs:
      profile:
        description: Integration expectation profile
        type: choice
        options:
          - smoke
          - healthy
        default: smoke
        required: true

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

jobs:
  ad-integration:
    if: ${{ vars.AD_LAB_ENABLED == 'true' }}
    runs-on: [self-hosted, Windows, X64, domain-lab]
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@30375c66a4eea26614e0d39710365f22f8b0af57 # v3

      - name: Validate AD lab configuration
        shell: pwsh
        env:
          AD_LAB_DOMAIN: ${{ vars.AD_LAB_DOMAIN }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:AD_LAB_DOMAIN)) {
            throw "Repository variable AD_LAB_DOMAIN is required when AD_LAB_ENABLED=true."
          }

          $cs = Get-CimInstance Win32_ComputerSystem
          Write-Host "Runner: $env:COMPUTERNAME"
          Write-Host "Identity: $([System.Security.Principal.WindowsIdentity]::GetCurrent().Name)"
          Write-Host "PartOfDomain: $($cs.PartOfDomain)"
          Write-Host "Domain: $($cs.Domain)"

          if (-not $cs.PartOfDomain) {
            throw "The self-hosted domain-lab runner must be domain joined."
          }

      - name: Build x64
        shell: cmd
        run: msbuild DomainMembershipCheckRepair.csproj /m /t:Rebuild /p:Configuration=Release /p:Platform=x64

      - name: Run AD integration diagnostics
        shell: pwsh
        env:
          AD_LAB_DOMAIN: ${{ vars.AD_LAB_DOMAIN }}
          AD_LAB_DC: ${{ vars.AD_LAB_DC }}
          AD_LAB_COMPUTER: ${{ vars.AD_LAB_COMPUTER }}
          AD_LAB_PROFILE: ${{ inputs.profile }}
        run: |
          $computer = $env:AD_LAB_COMPUTER
          if ([string]::IsNullOrWhiteSpace($computer)) {
            $computer = $env:COMPUTERNAME
          }

          $params = @{
            ExePath = ".\bin\Release\x64\DomainMembershipCheckRepair.exe"
            Domain = $env:AD_LAB_DOMAIN
            PreferredDc = $env:AD_LAB_DC
            ComputerName = $computer
            Profile = $env:AD_LAB_PROFILE
            OutputDirectory = ".\integration-artifacts"
          }

          .\Tests\Integration\Run-ADIntegrationTests.ps1 @params

      - name: Upload integration diagnostics
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: ad-integration-${{ github.run_id }}
          path: integration-artifacts/*
          if-no-files-found: warn
          retention-days: 14
