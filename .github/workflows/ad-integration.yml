name: AD Integration Lab

on:
  workflow_dispatch:
    inputs:
      profile:
        description: Integration expectation profile
        type: choice
        options:
          - smoke
          - healthy
        default: smoke
        required: true

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

concurrency:
  group: ad-integration-lab
  cancel-in-progress: false

jobs:
  ad-integration:
    if: ${{ vars.AD_LAB_ENABLED == 'true' }}
    runs-on: [self-hosted, Windows, X64, domain-lab]
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@30375c66a4eea26614e0d39710365f22f8b0af57 # v3

      - name: Validate AD lab configuration
        shell: pwsh
        env:
          AD_LAB_DOMAIN: ${{ vars.AD_LAB_DOMAIN }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:AD_LAB_DOMAIN)) {
            throw "Repository variable AD_LAB_DOMAIN is required when AD_LAB_ENABLED=true."
          }

          $cs = Get-CimInstance Win32_ComputerSystem
          Write-Host "Self-hosted AD lab runner configuration detected."
          Write-Host "Domain joined: $($cs.PartOfDomain)"

          if (-not $cs.PartOfDomain) {
            throw "The self-hosted domain-lab runner must be domain joined."
          }

      - name: Build x64
        shell: cmd
        run: msbuild DomainMembershipCheckRepair.csproj /m /t:Rebuild /p:Configuration=Release /p:Platform=x64

      - name: Run AD integration diagnostics
        shell: pwsh
        env:
          AD_LAB_DOMAIN: ${{ vars.AD_LAB_DOMAIN }}
          AD_LAB_DC: ${{ vars.AD_LAB_DC }}
          AD_LAB_COMPUTER: ${{ vars.AD_LAB_COMPUTER }}
          AD_LAB_PROFILE: ${{ inputs.profile }}
        run: |
          $computer = $env:AD_LAB_COMPUTER
          if ([string]::IsNullOrWhiteSpace($computer)) {
            $computer = $env:COMPUTERNAME
          }

          $params = @{
            ExePath = ".\bin\Release\x64\DomainMembershipCheckRepair.exe"
            Domain = $env:AD_LAB_DOMAIN
            PreferredDc = $env:AD_LAB_DC
            ComputerName = $computer
            Profile = $env:AD_LAB_PROFILE
            OutputDirectory = ".\integration-artifacts"
          }

          .\Tests\Integration\Run-ADIntegrationTests.ps1 @params

      - name: Sanitize integration artifacts
        if: always()
        shell: pwsh
        env:
          AD_LAB_DOMAIN: ${{ vars.AD_LAB_DOMAIN }}
          AD_LAB_DC: ${{ vars.AD_LAB_DC }}
          AD_LAB_COMPUTER: ${{ vars.AD_LAB_COMPUTER }}
        run: |
          if (Test-Path ".\integration-artifacts") {
            .\Tests\Integration\Sanitize-LabArtifacts.ps1 -InputDirectory ".\integration-artifacts" -OutputDirectory ".\integration-artifacts-sanitized"
          }

      - name: Upload sanitized integration diagnostics
        if: ${{ always() && vars.LAB_UPLOAD_SANITIZED_ARTIFACTS == 'true' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: ad-integration-sanitized-${{ github.run_id }}
          path: integration-artifacts-sanitized/*
          if-no-files-found: warn
          retention-days: 7

      - name: Clean lab artifacts from self-hosted runner
        if: always()
        shell: pwsh
        run: |
          Remove-Item ".\integration-artifacts" -Recurse -Force -ErrorAction SilentlyContinue
          Remove-Item ".\integration-artifacts-sanitized" -Recurse -Force -ErrorAction SilentlyContinue
