name: AD Integration Lab

on:
  workflow_dispatch:
    inputs:
      profile:
        description: Integration expectation profile
        type: choice
        options:
          - smoke
          - healthy
        default: smoke
        required: true

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

concurrency:
  group: ad-integration-lab
  cancel-in-progress: false

jobs:
  ad-integration:
    if: ${{ vars.AD_LAB_ENABLED == 'true' && github.ref == 'refs/heads/main' }}
    runs-on: [self-hosted, Windows, X64, domain-lab]
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@30375c66a4eea26614e0d39710365f22f8b0af57 # v3

      - name: Build x64
        shell: cmd
        run: msbuild DomainMembershipCheckRepair.csproj /m /t:Rebuild /p:Configuration=Release /p:Platform=x64

      - name: Run AD integration diagnostics
        shell: cmd
        env:
          AD_LAB_DOMAIN: ${{ vars.AD_LAB_DOMAIN }}
          AD_LAB_DC: ${{ vars.AD_LAB_DC }}
          AD_LAB_COMPUTER: ${{ vars.AD_LAB_COMPUTER }}
          AD_LAB_PROFILE: ${{ inputs.profile }}
        run: Tools\bin\Release\DomainMembershipCheckRepair.Tools.exe ad-integration --exe bin\Release\x64\DomainMembershipCheckRepair.exe --domain "%AD_LAB_DOMAIN%" --dc "%AD_LAB_DC%" --computer "%AD_LAB_COMPUTER%" --profile "%AD_LAB_PROFILE%" --output integration-artifacts

      - name: Sanitize integration artifacts
        if: always()
        shell: cmd
        env:
          AD_LAB_DOMAIN: ${{ vars.AD_LAB_DOMAIN }}
          AD_LAB_DC: ${{ vars.AD_LAB_DC }}
          AD_LAB_COMPUTER: ${{ vars.AD_LAB_COMPUTER }}
        run: if exist integration-artifacts Tools\bin\Release\DomainMembershipCheckRepair.Tools.exe sanitize-lab --input integration-artifacts --output integration-artifacts-sanitized

      - name: Upload sanitized integration diagnostics
        if: ${{ always() && vars.LAB_UPLOAD_SANITIZED_ARTIFACTS == 'true' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: ad-integration-sanitized-${{ github.run_id }}
          path: integration-artifacts-sanitized/*
          if-no-files-found: warn
          retention-days: 7

      - name: Clean lab artifacts from self-hosted runner
        if: always()
        shell: cmd
        run: |
          if exist integration-artifacts rmdir /s /q integration-artifacts
          if exist integration-artifacts-sanitized rmdir /s /q integration-artifacts-sanitized
