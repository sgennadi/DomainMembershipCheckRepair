name: Disposable AD Destructive Lab

on:
  workflow_dispatch:
    inputs:
      scenario:
        description: Destructive/disposable scenario to run
        type: choice
        options:
          - preflight
          - safe-fixes
          - repair-if-broken
          - mii-disable-rollback
          - recycle-bin-restore
        default: preflight
        required: true
      confirmation:
        description: Type DESTROY_DISPOSABLE_LAB to unlock mutating scenarios
        type: string
        required: true

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

concurrency:
  group: ad-destructive-lab
  cancel-in-progress: false

jobs:
  gate:
    runs-on: ubuntu-latest
    steps:
      - name: Validate destructive-lab gate
        shell: bash
        env:
          ENABLED: ${{ vars.AD_DESTRUCTIVE_LAB_ENABLED }}
          SCENARIO: ${{ inputs.scenario }}
          CONFIRMATION: ${{ inputs.confirmation }}
        run: |
          if [ "$ENABLED" != "true" ]; then
            echo "AD_DESTRUCTIVE_LAB_ENABLED must be set to true."
            exit 1
          fi

          if [ "$SCENARIO" != "preflight" ] && [ "$CONFIRMATION" != "DESTROY_DISPOSABLE_LAB" ]; then
            echo "Mutating scenarios require the exact confirmation string DESTROY_DISPOSABLE_LAB."
            exit 1
          fi

  destructive-ad-lab:
    if: ${{ github.ref == 'refs/heads/main' }}
    needs: gate
    runs-on: [self-hosted, Windows, X64, domain-destructive-lab]
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@30375c66a4eea26614e0d39710365f22f8b0af57 # v3

      - name: Build x64
        shell: cmd
        run: msbuild DomainMembershipCheckRepair.csproj /m /t:Rebuild /p:Configuration=Release /p:Platform=x64

      - name: Run disposable destructive scenario
        shell: cmd
        env:
          AD_LAB_DOMAIN: ${{ vars.AD_LAB_DOMAIN }}
          AD_LAB_DC: ${{ vars.AD_LAB_DC }}
          AD_LAB_COMPUTER: ${{ vars.AD_LAB_COMPUTER }}
          AD_LAB_TEST_OU_DN: ${{ vars.AD_LAB_TEST_OU_DN }}
          AD_LAB_USER: ${{ vars.AD_LAB_USER }}
          AD_LAB_PASSWORD: ${{ secrets.AD_LAB_PASSWORD }}
          LAB_SCENARIO: ${{ inputs.scenario }}
        run: Tools\bin\Release\DomainMembershipCheckRepair.Tools.exe ad-destructive --exe bin\Release\x64\DomainMembershipCheckRepair.exe --scenario "%LAB_SCENARIO%" --domain "%AD_LAB_DOMAIN%" --dc "%AD_LAB_DC%" --computer "%AD_LAB_COMPUTER%" --test-ou "%AD_LAB_TEST_OU_DN%" --output destructive-artifacts

      - name: Sanitize destructive-lab artifacts
        if: always()
        shell: cmd
        env:
          AD_LAB_DOMAIN: ${{ vars.AD_LAB_DOMAIN }}
          AD_LAB_DC: ${{ vars.AD_LAB_DC }}
          AD_LAB_COMPUTER: ${{ vars.AD_LAB_COMPUTER }}
          AD_LAB_TEST_OU_DN: ${{ vars.AD_LAB_TEST_OU_DN }}
          AD_LAB_USER: ${{ vars.AD_LAB_USER }}
          AD_LAB_PASSWORD: ${{ secrets.AD_LAB_PASSWORD }}
        run: if exist destructive-artifacts Tools\bin\Release\DomainMembershipCheckRepair.Tools.exe sanitize-lab --input destructive-artifacts --output destructive-artifacts-sanitized

      - name: Upload sanitized destructive-lab artifacts
        if: ${{ always() && vars.LAB_UPLOAD_SANITIZED_ARTIFACTS == 'true' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: ad-destructive-lab-sanitized-${{ github.run_id }}
          path: destructive-artifacts-sanitized/*
          if-no-files-found: warn
          retention-days: 7

      - name: Clean lab artifacts from self-hosted runner
        if: always()
        shell: cmd
        run: |
          if exist destructive-artifacts rmdir /s /q destructive-artifacts
          if exist destructive-artifacts-sanitized rmdir /s /q destructive-artifacts-sanitized
