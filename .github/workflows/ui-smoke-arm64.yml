name: ARM64 GUI Smoke Lab

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

jobs:
  ui-smoke-arm64:
    if: ${{ vars.ARM64_UI_LAB_ENABLED == 'true' && github.ref == 'refs/heads/main' }}
    runs-on: [self-hosted, Windows, ARM64, ui-lab]
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@30375c66a4eea26614e0d39710365f22f8b0af57 # v3

      - name: Verify ARM64 runner
        shell: cmd
        run: |
          echo PROCESSOR_ARCHITECTURE=%PROCESSOR_ARCHITECTURE%
          if /I not "%PROCESSOR_ARCHITECTURE%"=="ARM64" exit /b 1

      - name: Build ARM64
        shell: cmd
        run: msbuild DomainMembershipCheckRepair.csproj /m /t:Rebuild /p:Configuration=Release /p:Platform=ARM64

      - name: Run ARM64 GUI/DPI smoke test
        shell: cmd
        run: bin\Release\ARM64\DomainMembershipCheckRepair.exe --cli --action ui-smoke --json
