name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

concurrency:
  group: build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@30375c66a4eea26614e0d39710365f22f8b0af57 # v3

      - name: Build native repository tools
        shell: cmd
        run: msbuild Tools\DomainMembershipCheckRepair.Tools.csproj /m /t:Rebuild /p:Configuration=Release /p:Platform=AnyCPU

      - name: Validate repository policies
        shell: cmd
        run: Tools\bin\Release\DomainMembershipCheckRepair.Tools.exe validate-repository --root .

      - name: Test lab artifact sanitizer
        shell: cmd
        run: Tools\bin\Release\DomainMembershipCheckRepair.Tools.exe test-sanitizer

      - name: Verify .NET Framework targeting packs
        shell: cmd
        run: |
          if not exist "%ProgramFiles(x86)%\Reference Assemblies\Microsoft\Framework\.NETFramework\v4.8\mscorlib.dll" exit /b 1
          if not exist "%ProgramFiles(x86)%\Reference Assemblies\Microsoft\Framework\.NETFramework\v4.8.1\mscorlib.dll" exit /b 1

      - name: Build unit tests
        shell: cmd
        run: msbuild Tests\DomainMembershipCheckRepair.Tests.csproj /m /t:Rebuild /p:Configuration=Release /p:Platform=AnyCPU

      - name: Run unit tests
        shell: cmd
        run: Tests\bin\Release\DomainMembershipCheckRepair.Tests.exe

      - name: Build x86
        shell: cmd
        run: msbuild DomainMembershipCheckRepair.csproj /m /t:Rebuild /p:Configuration=Release /p:Platform=x86

      - name: Build x64
        shell: cmd
        run: msbuild DomainMembershipCheckRepair.csproj /m /t:Rebuild /p:Configuration=Release /p:Platform=x64

      - name: Run GUI/DPI smoke tests (x86)
        shell: cmd
        run: bin\Release\x86\DomainMembershipCheckRepair.exe --cli --action ui-smoke --json

      - name: Run GUI/DPI smoke tests (x64)
        shell: cmd
        run: bin\Release\x64\DomainMembershipCheckRepair.exe --cli --action ui-smoke --json

      - name: Build ARM64
        shell: cmd
        run: msbuild DomainMembershipCheckRepair.csproj /m /t:Rebuild /p:Configuration=Release /p:Platform=ARM64

      - name: Smoke-test native release orchestration
        shell: cmd
        run: |
          Tools\bin\Release\DomainMembershipCheckRepair.Tools.exe release-prepare --root . --unsigned ci-release-unsigned --configs ci-release-configs
          Tools\bin\Release\DomainMembershipCheckRepair.Tools.exe release-finalize --signed ci-release-unsigned --configs ci-release-configs --output ci-release-files
          Tools\bin\Release\DomainMembershipCheckRepair.Tools.exe release-smoke --directory ci-release-files

      - name: Prepare artifacts and checksums
        shell: cmd
        run: |
          if not exist artifacts mkdir artifacts
          findstr /C:"PerMonitorV2" bin\Release\x86\DomainMembershipCheckRepair.exe.config >nul || exit /b 1
          findstr /C:"PerMonitorV2" bin\Release\x64\DomainMembershipCheckRepair.exe.config >nul || exit /b 1
          findstr /C:"PerMonitorV2" bin\Release\ARM64\DomainMembershipCheckRepair.exe.config >nul || exit /b 1
          copy /y bin\Release\x86\DomainMembershipCheckRepair.exe artifacts\DomainMembershipCheckRepair-x86.exe >nul
          copy /y bin\Release\x86\DomainMembershipCheckRepair.exe.config artifacts\DomainMembershipCheckRepair-x86.exe.config >nul
          copy /y bin\Release\x64\DomainMembershipCheckRepair.exe artifacts\DomainMembershipCheckRepair-x64.exe >nul
          copy /y bin\Release\x64\DomainMembershipCheckRepair.exe.config artifacts\DomainMembershipCheckRepair-x64.exe.config >nul
          copy /y bin\Release\ARM64\DomainMembershipCheckRepair.exe artifacts\DomainMembershipCheckRepair-arm64.exe >nul
          copy /y bin\Release\ARM64\DomainMembershipCheckRepair.exe.config artifacts\DomainMembershipCheckRepair-arm64.exe.config >nul
          Tools\bin\Release\DomainMembershipCheckRepair.Tools.exe hash-dist --directory artifacts

      - name: Upload all architectures
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: DomainMembershipCheckRepair-all
          path: artifacts/*
          if-no-files-found: error
          retention-days: 14
