name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

concurrency:
  group: build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@30375c66a4eea26614e0d39710365f22f8b0af57 # v3

      - name: Verify .NET Framework targeting packs
        shell: pwsh
        run: |
          $base = "${env:ProgramFiles(x86)}\Reference Assemblies\Microsoft\Framework\.NETFramework"
          if (-not (Test-Path "$base\v4.8\mscorlib.dll")) { throw ".NET Framework 4.8 targeting pack is missing" }
          if (-not (Test-Path "$base\v4.8.1\mscorlib.dll")) { throw ".NET Framework 4.8.1 targeting pack is missing (required for ARM64)" }

      - name: Build unit tests
        shell: cmd
        run: msbuild Tests\DomainMembershipCheckRepair.Tests.csproj /m /t:Rebuild /p:Configuration=Release /p:Platform=AnyCPU

      - name: Run unit tests
        shell: pwsh
        run: |
          & .\Tests\bin\Release\DomainMembershipCheckRepair.Tests.exe
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Build x86
        shell: cmd
        run: msbuild DomainMembershipCheckRepair.csproj /m /t:Rebuild /p:Configuration=Release /p:Platform=x86

      - name: Build x64
        shell: cmd
        run: msbuild DomainMembershipCheckRepair.csproj /m /t:Rebuild /p:Configuration=Release /p:Platform=x64

      - name: Build ARM64
        shell: cmd
        run: msbuild DomainMembershipCheckRepair.csproj /m /t:Rebuild /p:Configuration=Release /p:Platform=ARM64

      - name: Prepare artifacts and checksums
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force artifacts | Out-Null
          $configs = @(
            ".\bin\Release\x86\DomainMembershipCheckRepair.exe.config",
            ".\bin\Release\x64\DomainMembershipCheckRepair.exe.config",
            ".\bin\Release\ARM64\DomainMembershipCheckRepair.exe.config"
          )
          foreach ($config in $configs) {
            if (-not (Test-Path $config)) { throw "Required DPI config is missing: $config" }
            $configText = Get-Content $config -Raw
            if ($configText -notmatch 'PerMonitorV2') { throw "PerMonitorV2 is missing from: $config" }
          }

          Copy-Item .\bin\Release\x86\DomainMembershipCheckRepair.exe .\artifacts\DomainMembershipCheckRepair-x86.exe
          Copy-Item .\bin\Release\x86\DomainMembershipCheckRepair.exe.config .\artifacts\DomainMembershipCheckRepair-x86.exe.config
          Copy-Item .\bin\Release\x64\DomainMembershipCheckRepair.exe .\artifacts\DomainMembershipCheckRepair-x64.exe
          Copy-Item .\bin\Release\x64\DomainMembershipCheckRepair.exe.config .\artifacts\DomainMembershipCheckRepair-x64.exe.config
          Copy-Item .\bin\Release\ARM64\DomainMembershipCheckRepair.exe .\artifacts\DomainMembershipCheckRepair-arm64.exe
          Copy-Item .\bin\Release\ARM64\DomainMembershipCheckRepair.exe.config .\artifacts\DomainMembershipCheckRepair-arm64.exe.config
          $lines = Get-ChildItem .\artifacts\DomainMembershipCheckRepair-* -File | Sort-Object Name | ForEach-Object {
            $hash = (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
            "$hash  $($_.Name)"
          }
          $lines | Set-Content -Encoding ascii .\artifacts\SHA256SUMS.txt

      - name: Upload all architectures
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: DomainMembershipCheckRepair-all
          path: artifacts/*
          if-no-files-found: error
          retention-days: 14
