name: Create v1.2.0 Tag

on:
  push:
    branches:
      - main

permissions:
  contents: write
  actions: write

jobs:
  create-tag:
    if: github.event.head_commit.message == 'Create v1.2.0 tag and dispatch release'
    runs-on: ubuntu-latest

    steps:
      - name: Create v1.2.0 tag on validated release commit
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_SHA: 95a04eca08416194e95223cbc5b54ca8fcfe44d4
        run: |
          gh api --method POST "repos/${GITHUB_REPOSITORY}/git/refs" \
            -f ref='refs/tags/v1.2.0' \
            -f sha="${TARGET_SHA}"

      - name: Dispatch normal release workflow on v1.2.0
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh workflow run release.yml --repo "${GITHUB_REPOSITORY}" --ref v1.2.0
