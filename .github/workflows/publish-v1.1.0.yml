name: Publish v1.1.0

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  publish:
    if: github.event.head_commit.message == 'Publish v1.1.0'
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Verify .NET Framework targeting packs
        shell: pwsh
        run: |
          $base = "${env:ProgramFiles(x86)}\Reference Assemblies\Microsoft\Framework\.NETFramework"
          if (-not (Test-Path "$base\v4.8\mscorlib.dll")) { throw ".NET Framework 4.8 targeting pack is missing" }
          if (-not (Test-Path "$base\v4.8.1\mscorlib.dll")) { throw ".NET Framework 4.8.1 targeting pack is missing (required for ARM64)" }

      - name: Build x86
        shell: cmd
        run: msbuild DomainMembershipCheckRepair.csproj /m /t:Rebuild /p:Configuration=Release /p:Platform=x86

      - name: Build x64
        shell: cmd
        run: msbuild DomainMembershipCheckRepair.csproj /m /t:Rebuild /p:Configuration=Release /p:Platform=x64

      - name: Build ARM64
        shell: cmd
        run: msbuild DomainMembershipCheckRepair.csproj /m /t:Rebuild /p:Configuration=Release /p:Platform=ARM64

      - name: Prepare release files
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force artifacts | Out-Null
          Copy-Item .\bin\Release\x86\DomainMembershipCheckRepair.exe .\artifacts\DomainMembershipCheckRepair-x86.exe
          Copy-Item .\bin\Release\x64\DomainMembershipCheckRepair.exe .\artifacts\DomainMembershipCheckRepair-x64.exe
          Copy-Item .\bin\Release\ARM64\DomainMembershipCheckRepair.exe .\artifacts\DomainMembershipCheckRepair-arm64.exe
          $lines = Get-ChildItem .\artifacts\*.exe | Sort-Object Name | ForEach-Object {
            $hash = (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
            "$hash  $($_.Name)"
          }
          $lines | Set-Content -Encoding ascii .\artifacts\SHA256SUMS.txt

          @'
# DomainMembershipCheckRepair v1.1.0

First public multi-architecture release.

Highlights:
- GUI and CLI modes.
- Automatic target-domain detection with manual override.
- Secure-channel check and native repair workflow.
- Join/Rejoin with the current computer name.
- Rename + Join recovery workflow.
- Read-only Active Directory computer-account lookup.
- Optional deletion of the exact conflicting AD computer object with safety checks and explicit confirmation.
- Replication-aware Join/Rejoin retry after AD object deletion.
- Diagnostics report including domain membership, secure channel, DC discovery, pending rename and NetSetup.log status.
- File logging is disabled by default and is never remembered.
- Domain usernames and passwords are not persisted.
- Builds for x86, x64 and Windows ARM64.

Requirements:
- x86/x64: .NET Framework 4.8.
- ARM64: Windows 11 on Arm with .NET Framework 4.8.1.

See README.md for usage, CLI syntax, exit codes and safety notes.
'@ | Set-Content -Encoding utf8 .\artifacts\RELEASE_NOTES.md

      - name: Create GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create v1.1.0 `
            .\artifacts\DomainMembershipCheckRepair-x86.exe `
            .\artifacts\DomainMembershipCheckRepair-x64.exe `
            .\artifacts\DomainMembershipCheckRepair-arm64.exe `
            .\artifacts\SHA256SUMS.txt `
            --target "$env:GITHUB_SHA" `
            --title "v1.1.0" `
            --notes-file .\artifacts\RELEASE_NOTES.md
